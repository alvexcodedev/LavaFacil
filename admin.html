<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · Lava Expresso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
</head>
<body class="admin">

<!-- ===== LOGIN ===== -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 0C11 0 21 12.2 21 17.5C21 23 16.5 26 11 26C5.5 26 1 23 1 17.5C1 12.2 11 0 11 0Z" fill="#00C2CB"/></svg>
      Lava Expresso
    </div>
    <h2>Painel da equipe</h2>
    <p class="sub">Entre com seu e-mail e senha cadastrados no Firebase.</p>
    <form id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required autocomplete="current-password">
      </div>
      <span class="err" id="login-error" style="margin-bottom:10px;">E-mail ou senha inválidos.</span>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
    <p style="margin-top:16px;"><a href="index.html" style="font-size:.82rem;color:var(--muted);">&larr; Voltar ao site</a></p>
  </div>
</div>

<!-- ===== PAINEL ===== -->
<div class="admin-shell" id="admin-shell">
  <div class="admin-topbar">
    <div class="logo">
      <svg viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 0C11 0 21 12.2 21 17.5C21 23 16.5 26 11 26C5.5 26 1 23 1 17.5C1 12.2 11 0 11 0Z" fill="#00C2CB"/></svg>
      Lava Expresso
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-view="painel">Painel</button>
      <button class="admin-tab" data-view="agenda">Agenda</button>
    </div>
    <div class="right">
      <button class="btn btn-ghost btn-sm" id="btn-logout" style="color:var(--foam); border-color:rgba(241,250,249,.35);">Sair</button>
    </div>
  </div>

  <div class="admin-main">

    <!-- ===== VIEW: PAINEL (dashboard) ===== -->
    <div class="admin-view active" id="view-painel">
      <div class="admin-toolbar-row">
        <h1>Painel Diário</h1>
        <button class="btn btn-primary btn-sm" id="btn-novo-agendamento">+ Novo agendamento</button>
      </div>

      <div class="stats-grid">
        <button type="button" class="stat-card amber" id="stat-pendentes">
          <div class="stat-top">
            <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
            <svg class="stat-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-num">0</div>
          <div class="stat-label">Pendentes</div>
        </button>

        <button type="button" class="stat-card blue" id="stat-confirmados">
          <div class="stat-top">
            <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 7V3M16 7V3M4 11h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2"/></svg></div>
            <svg class="stat-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-num">0</div>
          <div class="stat-label">Confirmados</div>
        </button>

        <button type="button" class="stat-card green" id="stat-concluidos">
          <div class="stat-top">
            <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <svg class="stat-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-num">0</div>
          <div class="stat-label">Concluídos</div>
        </button>

        <button type="button" class="stat-card red" id="stat-cancelados">
          <div class="stat-top">
            <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
            <svg class="stat-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-num">0</div>
          <div class="stat-label">Cancelados</div>
        </button>

        <button type="button" class="stat-card teal" id="stat-total">
          <div class="stat-top">
            <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 9h18" stroke="currentColor" stroke-width="2"/></svg></div>
            <svg class="stat-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-num">0</div>
          <div class="stat-label">Agendamentos hoje</div>
        </button>

        <button type="button" class="stat-card green" id="stat-faturamento">
          <div class="stat-top">
            <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 6H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
            <svg class="stat-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-num">R$ 0,00</div>
          <div class="stat-label">Recebido hoje</div>
        </button>
      </div>

      <h2 class="dash-section-title">Próximos agendamentos</h2>
      <div class="proximos-card">
        <div id="dash-proximos"><p class="muted-empty">Carregando…</p></div>
      </div>
    </div>

    <!-- ===== VIEW: AGENDA (calendário) ===== -->
    <div class="admin-view" id="view-agenda">
      <div class="admin-toolbar-row">
        <h1>Agenda</h1>
        
        <!-- === NOVO FILTRO ADICIONADO AQUI === -->
        <div style="display: flex; gap: 10px; align-items: center;">
          <select id="agenda-status-filter" style="padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); background: #fff; font-family: inherit; font-size: 0.9rem; cursor: pointer; color: var(--text);">
            <option value="">Todos os status</option>
            <option value="pendente">Pendentes</option>
            <option value="confirmado">Confirmados</option>
            <option value="concluido">Concluídos</option>
            <option value="cancelado">Cancelados</option>
          </select>
          <button class="btn btn-primary btn-sm" id="btn-novo-agendamento-2">+ Novo agendamento</button>
        </div>
      </div>

      <div class="filter-chip" id="filter-chip" hidden>
        Filtro: <span class="label"></span>
        <button type="button" id="filter-chip-clear">&times;</button>
      </div>

      <div class="calendar-card">
        <div id="calendar"></div>
        <div class="legend">
          <span><i style="background:var(--amber)"></i> Pendente</span>
          <span><i style="background:var(--blue)"></i> Confirmado</span>
          <span><i style="background:var(--green)"></i> Pago / concluído</span>
          <span><i style="background:#BBB"></i> Cancelado</span>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ===== MODAL AGENDAMENTO ===== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">&times;</button>
    <h3 id="modal-title">Novo agendamento</h3>
    <p class="modal-sub" id="modal-sub"></p>

    <form id="agendamento-form">
      <div class="field-row">
        <div class="field">
          <label for="f-nome">Cliente</label>
          <input type="text" id="f-nome" required>
        </div>
        <div class="field">
          <label for="f-telefone">Telefone</label>
          <input type="text" id="f-telefone" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-carro">Carro</label>
          <input type="text" id="f-carro" required>
        </div>
        <div class="field">
          <label for="f-placa">Placa</label>
          <input type="text" id="f-placa" required style="font-family:var(--font-plate); letter-spacing:.1em;">
        </div>
      </div>

      <div class="field">
        <label for="f-servico">Serviço</label>
        <select id="f-servico"></select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-data">Data</label>
          <input type="date" id="f-data" required>
        </div>
        <div class="field">
          <label for="f-hora">Horário</label>
          <input type="time" id="f-hora" required>
        </div>
      </div>

      <div class="field">
        <label>Status</label>
        <div class="status-select">
          <button type="button" class="status-chip" data-v="pendente">Pendente</button>
          <button type="button" class="status-chip" data-v="confirmado">Confirmado</button>
          <button type="button" class="status-chip" data-v="concluido">Concluído</button>
          <button type="button" class="status-chip" data-v="cancelado">Cancelado</button>
        </div>
        <input type="hidden" id="f-status-hidden" value="pendente">
      </div>

      <div class="field">
        <label class="pay-toggle">
          Pagamento recebido
          <span class="switch">
            <input type="checkbox" id="f-pago">
            <span class="track"></span>
          </span>
        </label>
      </div>

      <div class="field">
        <label for="f-obs">Observações</label>
        <textarea id="f-obs" rows="2"></textarea>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar</button>
      </div>
      <div class="modal-danger-row" id="modal-delete-row" hidden>
        <button type="button" class="btn btn-text" id="btn-cancelar-agendamento">Cancelar agendamento</button>
        ·
        <button type="button" class="btn btn-text" id="btn-excluir-agendamento" style="color:var(--red);">Excluir</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initAuth } from "./admin-auth.js";
  import { initCalendar, bindAdminUI, resizeCalendar } from "./admin-calendar.js";
  import { initDashboard } from "./admin-dashboard.js";

  // troca entre as abas Painel / Agenda
  document.querySelectorAll(".admin-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".admin-tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll(".admin-view").forEach((v) => v.classList.remove("active"));
      document.getElementById(`view-${tab.dataset.view}`).classList.add("active");
      if (tab.dataset.view === "agenda") {
        requestAnimationFrame(() => resizeCalendar());
      }
    });
  });

  // o botão "+ Novo agendamento" existe duplicado
  document.getElementById("btn-novo-agendamento-2").addEventListener("click", () => {
    document.getElementById("btn-novo-agendamento").click();
  });

  let started = false;
  initAuth({
    onLogin() {
      if (!started) {
        started = true;
        initCalendar();
        bindAdminUI();
        initDashboard();
      }
    },
  });
</script>
</body>
</html>
